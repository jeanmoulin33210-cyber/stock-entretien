name: Jury synchronization regression
on:
  push:
    paths:
      - 'js/**'
      - 'tests/**'
      - 'tests-culinaires.html'
      - '.github/workflows/jury-sync-regression.yml'
  pull_request:
    paths:
      - 'js/**'
      - 'tests/**'
      - 'tests-culinaires.html'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Jury identity and closure isolation
        run: node tests/jury-isolation.test.cjs
      - name: Two-device synchronization, concurrent saves and offline recovery
        run: node tests/owner-sync.test.cjs

      - name: Shared results and reviewed recovery
        run: |
          node tests/shared-results.test.cjs
          node tests/lot-d-recovery.test.cjs

      - name: Tester signature transport and jury isolation
        run: node tests/tester-signature.test.cjs

      - name: Reception temperature thresholds, refusals and traceability
        run: node tests/reception-temperature.test.cjs

      - name: Single tester signature and profile preservation
        run: node tests/tester-profile-signature.test.cjs

      - name: Live closure validation and chair save
        run: node tests/closure-live-validation.test.cjs

      - name: Automatic OCCENA layout and draft preservation
        run: node tests/occena-adaptive.test.cjs

      - name: Product sheet lists never revive deleted lots
        run: node tests/product-sheet-active.test.cjs

      - name: Final report attachment limit
        run: node tests/final-report-size.test.cjs

      - name: Owner and second administrator account access
        run: |
          node tests/owner-account.test.cjs
          node tests/second-admin.test.cjs
          node tests/report-admin-access.test.cjs

      - name: Fictitious establishment exercise isolation
        run: node tests/establishment-demo.test.cjs

      - name: Authenticated school trial isolation
        run: node --test tests/school-trials.test.cjs

      - name: School phone preparation and tester-only QR links
        run: node --test tests/school-phones.test.cjs
