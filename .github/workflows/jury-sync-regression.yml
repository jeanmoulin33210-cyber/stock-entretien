name: Jury synchronization regression
on:
  push:
    paths:
      - 'js/**'
      - 'tests/**'
      - 'tests-culinaires.html'
      - '.github/workflows/jury-sync-regression.yml'
  pull_request:
    paths:
      - 'js/**'
      - 'tests/**'
      - 'tests-culinaires.html'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Jury identity and closure isolation
        run: node tests/jury-isolation.test.cjs
      - name: Two-device synchronization, concurrent saves and offline recovery
        run: node tests/owner-sync.test.cjs

      - name: Shared results and reviewed recovery
        run: |
          node tests/shared-results.test.cjs
          node tests/lot-d-recovery.test.cjs

      - name: Tester signature transport and jury isolation
        run: node tests/tester-signature.test.cjs

      - name: Reception temperature thresholds, refusals and traceability
        run: node tests/reception-temperature.test.cjs
