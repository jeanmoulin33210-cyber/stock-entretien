name: Build Android APK

on:
  pull_request:
    paths:
      - "android-apk/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p android-apk --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android-apk/app/build/outputs/apk/debug/app-debug.apk dist/Tests-culinaires-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tests-culinaires-Android
          path: dist/Tests-culinaires-Android.apk
          retention-days: 30

      - name: Upload web source
        uses: actions/upload-artifact@v4
        with:
          name: Tests-culinaires-Web-Source
          path: |
            tests-culinaires.html
            manifest.webmanifest
            service-worker.js
            icon-192.png
            icon-512.png
            css
            js
          retention-days: 1
